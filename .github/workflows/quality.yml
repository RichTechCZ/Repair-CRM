name: Quality

on:
  push:
  pull_request:

jobs:
  php:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
      - name: Lint PHP
        run: find . -type f -name '*.php' -not -path './.git/*' -not -path './uploads/*' -print0 | xargs -0 -n1 php -l
      - name: Run regression tests
        run: php tests/run.php
